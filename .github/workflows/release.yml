name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "ubuntu-22.04"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Toolbox ${{ github.ref_name }}
          releaseBody: |
            ## O que há de novo
 
            Instale o arquivo apropriado para seu sistema (Windows .exe / .msi ou Linux .deb / .AppImage).
            O updater do Tauri publica também o `latest.json` para o fluxo contextual de atualização.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  verify-release-parity:
    name: Verify Multi-Platform Parity
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check Windows & Linux Artifact Parity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Verificando paridade de artefatos para a tag $TAG_NAME..."
          ASSETS=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Artefatos encontrados na release:"
          echo "$ASSETS"

          HAS_WIN_EXE=$(echo "$ASSETS" | grep -iE 'setup\.exe$|\.exe$' || true)
          HAS_LINUX_DEB=$(echo "$ASSETS" | grep -iE '\.deb$' || true)
          HAS_LINUX_APPIMAGE=$(echo "$ASSETS" | grep -iE '\.appimage$' || true)

          MISSING=0
          if [ -z "$HAS_WIN_EXE" ]; then
            echo "❌ ERRO DE PARIDADE: Nenhum executável/instalador Windows (.exe) encontrado na release!"
            MISSING=1
          else
            echo "✅ Windows (.exe) detectado: $HAS_WIN_EXE"
          fi

          if [ -z "$HAS_LINUX_DEB" ] && [ -z "$HAS_LINUX_APPIMAGE" ]; then
            echo "❌ ERRO DE PARIDADE: Nenhum pacote Linux (.deb ou .AppImage) encontrado na release!"
            MISSING=1
          else
            echo "✅ Linux detectado: deb=[$HAS_LINUX_DEB] appimage=[$HAS_LINUX_APPIMAGE]"
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Release parcial detectada! Paridade estrita entre Windows e Linux é mandatória."
            exit 1
          fi

          echo "🎉 Paridade Windows e Linux confirmada com sucesso na release $TAG_NAME!"

